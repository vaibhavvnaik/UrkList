# ============================================================
# REUSABLE WORKFLOW — Secret / Credential Scanner
# ============================================================
# This workflow is designed to be:
#   1. Called directly in this repo on every PR / push.
#   2. Referenced as a REQUIRED WORKFLOW in a GitHub Organization
#      Ruleset so it runs automatically across ALL repos — no
#      per-repo configuration needed (a.k.a. "refractory policy").
#
# Org-level setup (one-time, by an org admin):
#   Settings → Rules → Rulesets → New ruleset
#   • Target: All repositories (or choose specific ones)
#   • Required workflows → add this workflow
#     Repository: <org>/urk  (or wherever this file lives)
#     Workflow:   .github/workflows/secret-scan.yml
#     Ref:        main
# ============================================================

name: "Refractory Policy — Secret Scan"

on:
  # ---- Run directly in THIS repo ----
  pull_request:
    branches: ["*"]
  push:
    branches: ["main", "master", "develop"]

  # ---- Allow OTHER repos to call this as a reusable workflow ----
  workflow_call:
    inputs:
      scan_all_files:
        description: "Scan the entire tree instead of just changed files"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  secret-scan:
    name: "Scan for secrets & credentials"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so we can diff

      - name: Determine files to scan
        id: files
        run: |
          if [ "${{ inputs.scan_all_files }}" = "true" ]; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "mode=pr" >> "$GITHUB_OUTPUT"
          else
            echo "mode=push" >> "$GITHUB_OUTPUT"
          fi

      - name: Run secret scanner
        shell: bash
        run: |
          set -euo pipefail

          # -------------------------------------------------------
          # Patterns: LABEL:::REGEX
          # -------------------------------------------------------
          PATTERNS=(
            "MongoDB Connection String:::mongodb(\+srv)?://[^\s\"']+:[^\s\"']+@"
            "Generic Connection String:::://[a-zA-Z0-9_-]+:[a-zA-Z0-9_!@#\$%^&*]+@[a-zA-Z0-9.-]+"
            "AWS Access Key:::AKIA[0-9A-Z]{16}"
            "AWS Secret Key:::(?i)(aws_secret_access_key|aws_secret)\s*[=:]\s*['\"]?[A-Za-z0-9/+=]{40}"
            "Generic API Key:::(?i)(api[_-]?key|apikey|api[_-]?secret)\s*[=:]\s*['\"][a-zA-Z0-9_\-]{16,}['\"]"
            "Generic Secret:::(?i)(secret|password|passwd|pwd|token|auth_token|access_token)\s*[=:]\s*['\"][^\s'\"]{8,}['\"]"
            "Private Key Block:::-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----"
            "Slack Token:::xox[bporas]-[0-9a-zA-Z-]+"
            "GitHub Token:::gh[pousr]_[A-Za-z0-9_]{36,}"
            "Stripe Key:::sk_(live|test)_[0-9a-zA-Z]{24,}"
            "Google API Key:::AIza[0-9A-Za-z\\-_]{35}"
            "Bearer Token:::(?i)(authorization|bearer)\s*[=:]\s*['\"]Bearer\s+[a-zA-Z0-9_\-.]+['\"]"
            "Hex/Base64 Secret (32+ chars):::(?i)(secret|key|token|password)\s*[=:]\s*['\"][0-9a-fA-F]{32,}['\"]"
          )

          # Paths to always skip
          SKIP_REGEX='\.(lock|md|svg|png|jpg|jpeg|gif|ico|woff2?|ttf|eot)$|node_modules/|\.git/|\.env\.example$|\.env\.sample$|check-secrets\.sh$|secret-scan\.yml$'

          # ----- Collect file list -----
          MODE="${{ steps.files.outputs.mode }}"
          if [ "$MODE" = "all" ]; then
            mapfile -t FILES < <(git ls-files)
          elif [ "$MODE" = "pr" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            mapfile -t FILES < <(git diff --name-only --diff-filter=ACMR "$BASE" "$HEAD" 2>/dev/null || git ls-files)
          else
            mapfile -t FILES < <(git diff --name-only --diff-filter=ACMR HEAD~1 HEAD 2>/dev/null || git ls-files)
          fi

          found=0
          for file in "${FILES[@]}"; do
            [ -f "$file" ] || continue
            echo "$file" | grep -qE "$SKIP_REGEX" && continue
            file --mime "$file" 2>/dev/null | grep -q "binary" && continue

            for entry in "${PATTERNS[@]}"; do
              label="${entry%%:::*}"
              pattern="${entry##*:::}"
              matches=$(grep -nP "$pattern" "$file" 2>/dev/null || true)
              if [ -n "$matches" ]; then
                if [ $found -eq 0 ]; then
                  echo "::error::============================================"
                  echo "::error::  REFRACTORY POLICY VIOLATION — SECRETS FOUND"
                  echo "::error::============================================"
                fi
                found=$((found + 1))
                while IFS= read -r line; do
                  line_num="${line%%:*}"
                  echo "::error file=$file,line=$line_num::[$label] Potential secret detected (content hidden)"
                done <<< "$matches"
              fi
            done
          done

          if [ $found -gt 0 ]; then
            echo ""
            echo "::error::Found $found potential secret(s). Commit blocked by Refractory Policy."
            echo ""
            echo "To fix:"
            echo "  1. Move secrets to environment variables or GitHub Secrets"
            echo "  2. Reference them via process.env.* or \${{ secrets.* }}"
            echo "  3. Push corrected code"
            exit 1
          fi

          echo "✓ No secrets detected — Refractory Policy passed."
