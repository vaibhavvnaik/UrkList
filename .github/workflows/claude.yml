name: Claude Issue Builder

on:
  issues:
    types: [opened]

concurrency:
  group: claude-${{ github.repository }}-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  work_on_issue:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Run Claude Code automation
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: main
          branch_prefix: ''
          branch_name_template: '{{label}}/{{entityType}}-{{entityNumber}}-{{description}}'
          prompt: |
            ISSUE CONTEXT:
            - Number: #${{ github.event.issue.number }}
            - Title: ${{ github.event.issue.title }}
            - Body:
            ${{ github.event.issue.body }}

            AUTOMATION PLAN:
            1. Treat this issue as the spec, create a new working branch off `main`, and keep all changes scoped to what the description asks for.
            2. Make sure the issue has a type label (feat, bug, etc.); use the first label as the prefix and keep the branch name pattern `{{label}}/{{entityType}}-{{entityNumber}}-{{description}}` (e.g., `feat/issue-1234-add-cta`).
            3. Implement the fix or enhancement, updating docs or tests if needed and keeping commits clean.
            4. Run `npm run lint` and `npm run build`. If either command fails, report the failure details and refrain from pushing the branch.
            5. Commit with an imperative, descriptive message that references the issue number (e.g., "Address issue #1234: ...").
            6. Push the resulting branch so Vercel can build a preview environment tied to that branch.
            7. Leave an issue comment summarizing the change, the tests you ran, the branch name, and a note that the Vercel preview will be available once it finishes building.
            8. Do not create or submit a pull request--just leave the branch and final comment so the owners can review, merge, or open the PR themselves.

            When you comment, rely on the action's pre-filled PR link instead of opening the PR yourself; the comment should give me enough context to review the preview deployment and create the PR if everything looks good.
          claude_args: |
            --model "claude-opus-4-5"
            --max-turns 100
            --allowedTools "Read,Write,Edit,Bash(git:*),Bash(gh issue comment:*),Bash(npm run lint),Bash(npm run build)"

      - name: Surface Vercel preview deployments
        if: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_PROJECT_ID != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_BRANCH: ${{ steps.claude.outputs.branch_name }}
        run: |
          set -euo pipefail

          if [ -z "$VERCEL_BRANCH" ]; then
            echo "No branch name reported by Claude. Skipping Vercel lookup."
            exit 0
          fi

          team_query=""
          if [ -n "${VERCEL_TEAM_ID:-}" ]; then
            team_query="&teamId=${VERCEL_TEAM_ID}"
          fi

          query="projectId=${VERCEL_PROJECT_ID}&gitBranch=${VERCEL_BRANCH}${team_query}&limit=5"
          echo "Querying Vercel for deployments associated with branch '$VERCEL_BRANCH'..."
          response=$(curl -sSL -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v6/deployments?${query}")
          echo "🔍 Vercel deployments:"
          echo "$response" | jq -c '.deployments[] | {id:.uid, url:.url, state:.state, env:.meta.env, created:.created}'

          deployment_id=$(echo "$response" | jq -r '.deployments[0].uid // empty')
          if [ -n "$deployment_id" ]; then
            echo "✨ Fetching events for deployment $deployment_id"
            events=$(curl -sSL -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v2/deployments/${deployment_id}/events")
            echo "$events" | jq -c '.events[] | {type:.type, state:.state, createdAt:.createdAt, meta:.meta}'
          else
            echo "::warning::No deployment yet for branch $VERCEL_BRANCH."
          fi
