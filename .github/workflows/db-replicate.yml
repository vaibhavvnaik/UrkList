name: Replicate Production DB to Preview and Dev

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

jobs:
  replicate-db:
    runs-on: ubuntu-latest

    steps:
      - name: Install MongoDB tools
        run: |
          wget -qO - https://www.mongodb.org/static/pgp/server-7.0.asc | sudo apt-key add -
          echo "deb [ arch=amd64,arm64 ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/7.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-7.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-database-tools
          mongodump --version
          mongorestore --version

      - name: Dump production database
        run: |
          mongodump \
            --uri="${{ secrets.MONGODB_URI_PROD }}" \
            --out=/tmp/prod_dump
          echo "Dump complete"
          ls /tmp/prod_dump/

      - name: Restore to preview database (urklist_preview)
        run: |
          mongorestore \
            --uri="${{ secrets.MONGODB_URI_PREVIEW }}" \
            --drop \
            --db=urklist_preview \
            /tmp/prod_dump/urklist
          echo "Preview restore complete"

      - name: Restore to development database (urklist_dev)
        run: |
          mongorestore \
            --uri="${{ secrets.MONGODB_URI_DEV }}" \
            --drop \
            --db=urklist_dev \
            /tmp/prod_dump/urklist
          echo "Dev restore complete"
