# ============================================================
# STARTER WORKFLOW — Secret Scan (Refractory Policy)
# ============================================================
# This is a GitHub Starter Workflow template.
# When placed in the org-level ".github" repo under
# workflow-templates/, it appears in every repo's
# "Actions → New workflow" page for easy adoption.
#
# However, if you set up the Org Ruleset (recommended),
# repos do NOT need this file — the scan is enforced
# automatically across the org.
# ============================================================

name: "Secret Scan (Refractory Policy)"

on:
  pull_request:
    branches: [$default-branch]
  push:
    branches: [$default-branch]

jobs:
  secret-scan:
    uses: ${{ github.repository_owner }}/urk/.github/workflows/secret-scan.yml@main
    with:
      scan_all_files: false
